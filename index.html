<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Static</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="hero-container">
      <video autoplay muted loop playsinline class="hero-video">
        <source src="static.mp4" type="video/mp4" />

      <div class="hero-left">
        <p>
          The longer you watch... <br />
          the closer It gets

        <div class="line-wrapper">

            <div class="line"></div>
            <a href="#">New Releases</a>
          </div>
          <div class="line-container">
            <div class="line"></div>
            <a href="#">Movies</a>
          </div>
          <div class="line-container">
            <div class="line"></div>
            <a href="#">Games</a>
          </div>
          <div class="line-container">
            <div class="line"></div>
            <a href="#">Reviews</a>
          </div>
        </div>
      </div>

      <div class="hero-right">
        <h1>Black Static</h1>
      </div>
    </div>

    <section class="movies-section">
      <div class="line-container">
        <h2>Coming Soon</h2>
      </div>

      <div class="card-container">
        <div class="card">
          <img src="imgs/scream7.jpeg" alt="scream 7" />

        </div>
        <div class="card">
          <img src="imgs/exit8.jpeg" alt="exit 8" />

        </div>
        <div class="card">
          <img src="imgs/evil-dead.jpeg" alt="evil dead burn" />

        </div>
        <div class="card">
          <img src="imgs/evil-dead.jpeg" alt="evil dead burn" />
          <h3>Evil Dead Burn</h3>
        </div>
        <div class="card">
          <img src="imgs/evil-dead.jpeg" alt="evil dead burn" />
          <h3>Evil Dead Burn</h3>
        </div>
      </div>
    </section>
  </body>
</html>
